name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --all-targets

  # Rust cannot cross-compile Windows/macOS from Linux the way Go can, so each
  # target builds on a native runner (or, for the cross-only Linux targets,
  # through `cross` on a Linux runner).
  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-amd64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            extra: musl
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-arm64-musl
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            use-cross: true
          - name: linux-arm
            runner: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            archive: tar.gz
            use-cross: true
          - name: darwin-amd64
            runner: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.extra == 'musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="llm-gateway-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/llm-gateway"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="${bin}.exe"
            cp "$bin" "dist/$name/llm-gateway.exe"
          else
            cp "$bin" "dist/$name/llm-gateway"
          fi
          cp config.example.yaml "dist/$name/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && zip -rq "$name.zip" "$name")
          else
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          echo "archive=dist/$name.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - name: Upload binary archive
        uses: actions/upload-artifact@v5
        with:
          name: llm-gateway-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/kunxu984/coniferous-cmd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Login to Docker Hub
        # Push only happens on tags; skip the login (and its secrets) elsewhere.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch only on release tags; plain amd64 build otherwise,
          # so regular pushes validate the Dockerfile cheaply without QEMU.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v5
        with:
          pattern: llm-gateway-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
