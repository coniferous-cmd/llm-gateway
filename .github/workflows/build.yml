name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CGO_ENABLED: '0'

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        include:
          # 32-bit ARM (Raspberry Pi and similar); no windows/darwin/arm target.
          - goos: linux
            goarch: arm
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="llm-gateway-${GOOS}-${GOARCH}"
          binary=llm-gateway
          if [[ "$GOOS" == windows ]]; then
            binary="${binary}.exe"
          fi
          mkdir -p "dist/$name"
          go build -trimpath -ldflags='-s -w' -o "dist/$name/$binary" ./cmd/llm-gateway
          cp config.example.yaml "dist/$name/"
          if [[ "$GOOS" == windows ]]; then
            archive="${name}.zip"
            (cd dist && zip -r "$archive" "$name")
          else
            archive="${name}.tar.gz"
            tar -czf "dist/$archive" -C dist "$name"
          fi
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"
      - name: Upload binary archive
        uses: actions/upload-artifact@v5
        with:
          name: llm-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v5
        with:
          pattern: llm-gateway-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
