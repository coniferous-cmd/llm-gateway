[package]
name = "llm-gateway"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "A lightweight, locally running LLM gateway"
build = "build.rs"

[lib]
name = "llm_gateway"
path = "src/lib.rs"

[[bin]]
name = "llm-gateway"
path = "src/main.rs"

[dependencies]
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
base64 = "0.23"
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "string"] }
clap_complete = "4.6"
getrandom = "0.3"
http = "1.5"
http-body = "1.1"
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["server", "client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "native-tokio", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "http2", "tokio", "server", "server-graceful"] }
percent-encoding = "2.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
saphyr = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-service = "0.3"
url = "2.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2"
futures-util = "0.3"
predicates = "3"
proptest = "1"
tempfile = "3"
tokio-test = "0.4"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
