listen: "127.0.0.1:8080"

# Optional: encrypted gateway-to-gateway channel (Noise IK over X25519).
# Generate the identity with `llm-gateway --keygen`; keep identity_key secret
# on this machine and hand identity_pub to the peer operator out of band.
# Remove this whole section if this gateway never talks to another gateway.
#e2ee:
#  listen: "0.0.0.0:8081" # encrypted peer port; firewall it to known peers
#  identity_key: "REPLACE-with-llm-gateway---keygen-output"
#  peers:
#    - name: gateway-c
#      base_url: "http://10.0.0.2:8081" # the peer's e2ee.listen address
#      identity_pub: "REPLACE-with-the-peers-identity_pub"

keys:
  - token: sk-virt-dev
    target:
      base_url: https://api.openai.com
      api_key: sk-real-replace-me
      # Optional ordered path-prefix rules, inside target (not beside token).
      # First full-segment prefix match wins; no chaining. Put specific rules
      # before broad ones. Query and unmatched/omitted paths stay unchanged.
      # /api/chat/completions?stream=true -> /v1/chat/completions?stream=true
      rewrite:
        - '/api:/v1'
        - '/openai:/v1'
        # '-' deletes the prefix: /anthropic/v1/messages -> /v1/messages;
        # /anthropic and /anthropic/ become /. An empty destination is invalid.
        - '/anthropic:-'
    # Optional: the models this entry serves. "id" is the model name callers
    # send in their requests, "name" is the model name the provider receives.
    # A caller id ending in [1m] falls back to the id without that suffix and
    # the suffix is appended to "name" (e.g. mimo-v2.6-pro[1m]).
    models:
      - id: mimo-v2.6-flash
        name: mimo-v2.6-flash
      - id: mimo-v2.6-pro
        name: mimo-v2.6-pro
  # Repeat a token to round-robin across compatible upstreams. Each target
  # has its own rules; e.g. another sk-virt-dev target could use:
  #- token: sk-virt-dev
  #  target:
  #    base_url: https://other.example.com
  #    api_key: sk-other-replace-me
  #    rewrite:
  #      - '/api:/v2'
  #      - '/openai:/v2'
  # api_key is optional for upstreams that do not require authentication.
  - token: sk-virt-local
    target:
      base_url: http://127.0.0.1:11434/
  # Forward over the encrypted link to a peer gateway instead of a plain
  # upstream: `peer` names an entry in e2ee.peers (mutually exclusive with
  # base_url). api_key is the virtual key the *peer* gateway accepts.
  #- token: sk-virt-through-c
  #  target:
  #    peer: gateway-c
  #    api_key: sk-virt-on-gateway-c
  #    rewrite:
  #      - '/api:/v1' # applies once here, before the encrypted hop
